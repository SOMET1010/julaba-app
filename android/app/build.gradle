apply plugin: 'com.android.application'
// Kotlin : le plugin natif SherpaStt (reconnaissance vocale hors-ligne) est en Kotlin.
apply plugin: 'org.jetbrains.kotlin.android'

def julabaReleaseStoreFile = System.getenv("JULABA_RELEASE_STORE_FILE")
def julabaReleaseStorePassword = System.getenv("JULABA_RELEASE_STORE_PASSWORD")
def julabaReleaseKeyAlias = System.getenv("JULABA_RELEASE_KEY_ALIAS")
def julabaReleaseKeyPassword = System.getenv("JULABA_RELEASE_KEY_PASSWORD")

// RC1 — LE NUMERO DE VERSION VIENT DE LA CI, JAMAIS D'UN LITTERAL.
//
// Un versionCode fige a 1 ne distingue aucun build du suivant : on ne peut plus
// savoir quelle version une marchande a sur son telephone. Pire, un numero qui
// RECULE condamne definitivement la mise a jour des appareils deja equipes
// (INSTALL_FAILED_VERSION_DOWNGRADE), et la seule issue est une desinstallation,
// qui efface sa caisse.
//
// La CI passe les secondes ecoulees depuis le 01/01/2026 UTC. Une horloge ne
// revient pas en arriere, contrairement a un compteur de run GitHub, qui repart
// a 1 si le workflow est renomme ou recree. Marge : ~66 ans avant la limite
// Android de 2 100 000 000.
//
// Une valeur fournie mais illisible ARRETE la construction. Jamais de repli
// silencieux sur 1 : c'est exactement le genre de retombee muette qui a fait
// distribuer des APK signes en cle de debug pendant des mois.
def julabaVersionCodeFourni = System.getenv("JULABA_VERSION_CODE")
def julabaVersionCode = 1
if (julabaVersionCodeFourni != null && !julabaVersionCodeFourni.trim().isEmpty()) {
    def brut = julabaVersionCodeFourni.trim()
    if (!(brut ==~ /\d+/) || (brut as long) <= 0L || (brut as long) > 2100000000L) {
        throw new GradleException(
            "JULABA_VERSION_CODE illisible ou hors limites : « " + brut + " ». " +
            "Attendu : un entier strictement positif, au plus 2100000000.")
    }
    julabaVersionCode = brut as int
}
def julabaVersionName = System.getenv("JULABA_VERSION_NAME") ?: "1.0"

android {
    namespace = "com.julaba.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.julaba.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode julabaVersionCode
        versionName julabaVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (julabaReleaseStoreFile && julabaReleaseStorePassword && julabaReleaseKeyAlias && julabaReleaseKeyPassword) {
                storeFile file(julabaReleaseStoreFile)
                storePassword julabaReleaseStorePassword
                keyAlias julabaReleaseKeyAlias
                keyPassword julabaReleaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // sherpa-onnx : moteur de reconnaissance vocale hors-ligne (plugin SherpaStt).
    // L'AAR (API Kotlin + libs natives arm64/armv7/x86_64) N'EST PAS commité
    // (.gitignore *.aar) : le poser via  android/scripts/installer-voix.sh
    // AVANT tout assembleDebug/Release — il télécharge aussi le modèle FR (~71 Mo)
    // dans src/main/assets/sherpa-kroko-fr/. Sans ces fichiers, le build échoue
    // ici (unresolved com.k2fsa.sherpa.onnx) — c'est voulu, pas silencieux.
    implementation files('libs/sherpa-onnx-1.13.5.aar')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
