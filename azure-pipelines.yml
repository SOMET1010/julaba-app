# JULABA Azure Pipelines
# Validation du dépôt + build docker de l'image backend.
# La cible de production finale reste explicite par l'infra, mais cette pipeline
# garantit qu'une branche de travail est au moins installable, buildable et
# packageable avant d'être poussée vers l'environnement cible.

trigger:
- main
- dev

pr:
- main
- dev

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Validate
  displayName: Validate repository
  jobs:
  - job: BuildAndCheck
    displayName: Install, build, and validate
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install dependencies

    - script: npm run build --workspace frontend
      displayName: Build frontend

    - script: npm run build --workspace backend
      displayName: Build backend

    - script: npm run typecheck --workspace frontend
      displayName: Typecheck frontend

- stage: Build
  displayName: Build runtime image
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: Docker
    displayName: Build backend image
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build backend container image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/backend/Dockerfile'
        tags: |
          $(tag)
