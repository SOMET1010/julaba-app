# DÉMARRAGE — le seul flow qui ne demande AUCUN identifiant.
#
# Il répond à une question simple et souvent fausse : l'APK s'ouvre-t-il, et
# arrive-t-il jusqu'à son écran de connexion ? C'est aussi le flow qui prouve
# que le BANC lui-même fonctionne : s'il tombe, inutile de lire les autres.
appId: com.julaba.app
name: 01 — l'application démarre et montre sa connexion
tags:
  - sansCompte
  - fumee
---
- clearState
- launchApp:
    clearKeychain: false
    stopApp: true

# LES LIBELLÉS DE CE FLOW SONT MESURÉS, PLUS DEVINÉS — run #11 (SONDE).
#
# Pendant six runs ce flow a attendu « Mon compte ». Ce texte n'existe pas :
# l'écran affiche « Mon commerce ». Et j'attendais aussi « Akwaba » — un mot
# que l'application PRONONCE (sherpa TTS le synthétise, c'est dans le logcat)
# mais qu'elle N'ÉCRIT JAMAIS. J'avais pris une phrase entendue pour un texte
# affiché.
#
# CE QUE LA SONDE A RELEVÉ, écran d'entrée, JULABA au premier plan en 4 s :
#     « JÙLABA »                                    « Mon commerce »
#     « Jùlaba - Plateforme d'inclusion économique » « Écouter et entrer »
#     « Ton commerce, dans ta main. »               « Écouter Tantie Nanti Lou »
#     « Vends. Compte. Avance. »                    « ANSUT »
# 17 textes, 1 nœud `com.julaba.app`, 2 nœuds WebView : le contenu HTML est
# bien lisible par Maestro — l'instrumentation `data-testid` n'est pas requise.
- extendedWaitUntil:
    visible: "JÙLABA"
    timeout: 90000

- takeScreenshot: 01-connexion

# LA VERSION EST LISIBLE À L'ŒIL NU. Un compte rendu sans SHA est inutilisable,
# et on l'a déjà payé une fois (APK 0459dc0, construit sur un verify rouge).
# L'ENTRÉE EST NOMMÉE, et c'est son nom à elle : « Mon commerce », pas
# « Mon compte ». Les deux portes de l'écran d'entrée sont vérifiées.
- assertVisible: "Mon commerce"
- assertVisible: "Écouter et entrer"

# La version est en bas de l'écran. `optional` : un compte rendu sans elle est
# inutilisable, mais son absence n'empêche pas l'application de démarrer.
- assertVisible:
    text: "v[0-9].*"
    optional: true
