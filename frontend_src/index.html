<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jùlaba - Plateforme nationale d'inclusion économique des acteurs vivriers en Côte d'Ivoire" />
    <meta name="theme-color" content="#16a34a" />
    <title>Jùlaba - Plateforme d'inclusion économique</title>
    <!-- Aucun preconnect vers Google : plus aucune police n'en vient.
         Ces deux lignes ouvraient une connexion DNS + TLS vers Google à
         CHAQUE lancement ; sans reseau, c'est une attente pour rien. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Les icones Tabler sont EMBARQUEES, plus chargees d'un CDN.
         L'ancienne ligne tirait 462 Ko de police + 211 Ko de CSS depuis
         jsdelivr en @latest : sans reseau aucune icone, et la version
         pouvait changer d'un lancement a l'autre. Le sous-ensemble des 19
         icones reellement utilisees vit dans src/styles/icons-tabler.css. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      ATTRIBUT `lang` DYNAMIQUE (INIT-020) :
      La valeur par défaut `fr` ci-dessus reste la source de vérité initiale
      (HTML statique, lisible par les robots et les lecteurs d'écran AVANT le
      boot React). Au démarrage, `i18n/config.ts → initI18n()` lit
      `localStorage['julaba_lang']` et met à jour
      `document.documentElement.lang` avec le code ISO 639 correspondant
      (`fr` / `dyu` / `bm`). À chaque changement de langue via `useLangPref`,
      `appliquerLangueI18n()` met aussi à jour cet attribut (a11y — les
      lecteurs d'écran s'appuient dessus pour la prononciation).
    -->
    <script>
      // Pré-charge la langue préférée AVANT le boot React pour éviter un
      // flash `<html lang="fr">` → `<html lang="dyu">` qui désorienterait les
      // lecteurs d'écran au démarrage. Sans ce script, l'attribut resterait
      // `fr` jusqu'au 1er render React (~300 ms après le parse HTML).
      (function () {
        try {
          var lang = localStorage.getItem('julaba_lang');
          var mapping = { french: 'fr', dioula: 'dyu', bambara: 'bm' };
          if (lang && mapping[lang]) {
            document.documentElement.lang = mapping[lang];
          }
        } catch (_e) { /* ignore — localStorage indisponible ou quota dépassé */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
