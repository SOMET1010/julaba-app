# ──────────────────────────────────────────────────────────────────────────
# Blueprint Render — Julaba V2 INDÉPENDANT (serveur à soi, séparé de la V1)
#
# Monte 3 briques d'un coup depuis ce dépôt :
#   1) julaba-db   : base PostgreSQL managée
#   2) julaba-api  : backend NestJS (API caisse)  -> migrations auto au démarrage
#   3) julaba-web  : frontend React (site statique)
#
# Le CŒUR (vendre / dépenser, y compris hors-ligne) tourne SANS clé API payante.
# Les clés OpenAI / ElevenLabs sont optionnelles (conversation libre + belle voix
# cloud) et se saisissent plus tard.
#
# ⚠️ Deux valeurs se saisissent APRÈS le 1er déploiement (voir docs/DEPLOIEMENT_RENDER.md) :
#    - julaba-api : CORS_ORIGIN  = l'URL du frontend (https://julaba-web.onrender.com)
#    - julaba-web : VITE_API_URL = l'URL du backend + /api/v1
#      (https://julaba-api.onrender.com/api/v1) puis relancer le build du frontend.
# ──────────────────────────────────────────────────────────────────────────

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  PLANS ALIGNÉS SUR LA RÉALITÉ — 17/09/2026. NE PAS LES REMETTRE EN free. ║
# ║                                                                          ║
# ║  Ces deux plans ont longtemps été déclarés `free` ici alors que les      ║
# ║  services tournaient en payant : ils avaient été changés au tableau de   ║
# ║  bord, hors Blueprint. Une synchronisation aurait donc cherché à les     ║
# ║  RAMENER en `free` — un redéploiement pour le service, mais des DONNÉES  ║
# ║  pour la base. Le fichier dit lui-même pourquoi on est sorti du gratuit  ║
# ║  côté base : elle expire ~90 jours.                                      ║
# ║                                                                          ║
# ║  Identifiants confirmés par Patrick au tableau de bord le 17/09 :        ║
# ║     julaba-db  -> basic_256mb                                            ║
# ║     julaba-api -> starter                                                ║
# ║                                                                          ║
# ║  Le fichier correspondant désormais à l'existant, une synchronisation    ║
# ║  ne change plus rien sur ces lignes. C'est le but : la dérive est levée. ║
# ╚══════════════════════════════════════════════════════════════════════════╝

databases:
  - name: julaba-db
    databaseName: julaba
    user: julaba
    # Payant DÉLIBÉRÉMENT : la base gratuite Render expire ~90 jours, et une
    # base qui expire emporte les données d'une marchande avec elle.
    plan: basic_256mb

services:
  # ── Backend NestJS ──────────────────────────────────────────────────────
  - type: web
    runtime: node
    name: julaba-api
    rootDir: backend
    # Starter (7 $/mois) : le plan gratuit s'endort et réveille le serveur à
    # la première requête — une marchande n'attend pas devant sa caisse.
    plan: starter
    # Redéploiement AUTOMATIQUE à chaque push sur la branche suivie : indispensable
    # pour que le seed (comptes + scénario de démo) se rejoue au démarrage.
    autoDeploy: true
    # setup-piper.sh est DÉFENSIF (sort en 0 même s'il échoue) : le build ne peut
    # pas casser à cause de Piper ; sans Piper, l'appli parle via le navigateur.
    buildCommand: bash scripts/setup-piper.sh; npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # ── Voix Piper (TTS souverain, gratuit à l'usage) ──
      # Chemins où setup-piper.sh installe le binaire + la voix (rootDir = backend).
      - key: PIPER_BIN
        value: /opt/render/project/src/backend/.piper/piper/piper
      - key: PIPER_VOICE
        value: /opt/render/project/src/backend/.piper/voice.onnx
      # Coupe le TTS cloud payant : Piper (ou la voix navigateur) suffit.
      - key: TTS_DISABLE_CLOUD
        value: "true"
      # Base de données (câblée automatiquement depuis julaba-db)
      - key: DB_HOST
        fromDatabase: { name: julaba-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: julaba-db, property: port }
      - key: DB_USERNAME
        fromDatabase: { name: julaba-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: julaba-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: julaba-db, property: database }
      - key: DB_SSL
        value: "true"
      # (Schéma : construit automatiquement au 1er démarrage si la base est vide
      #  — géré par prepareDatabase() dans main.ts. Aucun réglage manuel requis.)
      # Cookies cross-domaine (frontend et backend sur des domaines différents)
      - key: COOKIE_SAMESITE
        value: none
      # Secrets générés automatiquement par Render
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_ENCRYPTION_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SALT
        generateValue: true
      # URL du frontend autorisée (CORS + cookies cross-domaine)
      - key: CORS_ORIGIN
        value: https://julaba-web.onrender.com
      # Comptes de démo : DÉSACTIVÉS par défaut (le backend les refuse d'office
      # en production sauf opt-in explicite). Sur un serveur de DÉMO assumé,
      # passer à "true" au dashboard — jamais sur un serveur réel : les mots de
      # passe de ces comptes sont publiés dans le dépôt.
      - key: SEED_DEMO
        value: "false"
      # Code marchand = pavé à 4 chiffres -> le mot de passe de démo DOIT être
      # un code numérique à 4 chiffres (utilisé seulement si SEED_DEMO="true").
      - key: SEED_DEMO_PASSWORD
        value: "1234"
      # MOT DE PASSE DES COMPTES D'ADMINISTRATION DE DÉMO — DÉLIBÉRÉMENT SANS
      # VALEUR ICI, ET CE N'EST PAS UN OUBLI.
      #
      # Le seed crée des comptes ADMIN_GENERAL. Leur mot de passe valait
      # "123456" écrit en dur dans un dépôt PUBLIC : activer SEED_DEMO sur ce
      # serveur y ouvrait un accès d'administration connu de tous. Et remettre
      # SEED_DEMO à "false" n'efface RIEN — le drapeau arrête de créer, pas de
      # supprimer : les comptes seraient restés indéfiniment.
      #
      # Sans cette variable, les comptes back-office ne sont PAS créés (les
      # comptes acteurs le sont normalement). Pour en avoir besoin un jour :
      # la renseigner au tableau de bord Render, JAMAIS ici — un `value:` dans
      # ce fichier est publié avec le dépôt.
      - key: SEED_DEMO_BO_PASSWORD
        sync: false
      # ╔════════════════════════════════════════════════════════════════════╗
      # ║  "false", ET C'EST DÉLIBÉRÉ. NE PAS REMETTRE À "true" SANS LIRE.  ║
      # ╚════════════════════════════════════════════════════════════════════╝
      #
      # L'INCIDENT DU 18/09/2026. À "true", l'API ne redémarre plus du tout :
      # elle meurt au boot sur `type "caisse_transaction_status_enum" already
      # exists`, dix tentatives, puis extinction.
      #
      # POURQUOI. schema-flags.ts construit une base VIERGE depuis les entités
      # (`synchronize`) et n'enregistre AUCUNE migration : la table `migrations`
      # reste vide. Au démarrage suivant la base n'est plus vierge, TypeORM
      # croit donc la baseline « en attente » et rejoue
      # 1780200000000-BaselineSchema — dont les 17 `CREATE TYPE` n'ont aucune
      # protection contre l'existant. Le schéma est là, son enregistrement ne
      # l'est pas : la chaîne de migrations ne peut pas ADOPTER cette base.
      #
      # CE QUI FAIT VRAIMENT LE SCHÉMA EN PROD, et db-init.service.ts le dit
      # déjà à deux endroits : DbInit. Il est « le SEUL mécanisme garanti de
      # s'exécuter inconditionnellement au boot, base neuve ET existante », et
      # il recrée chaque objet de façon idempotente. Ce fichier contredisait
      # simplement ce que le code fait depuis toujours.
      #
      # CE QUE ÇA COÛTE, assumé : une nouvelle migration ne s'appliquera pas
      # toute seule en prod. Elle doit être reflétée dans DbInit, comme l'ont
      # été les communes GPS et boutique_mouvements. Rendre la chaîne
      # adoptable est un chantier à part, qui demande un accès à la base.
      - key: DB_MIGRATIONS_RUN
        value: "false"
      # Quotas par IP corrects derrière le routeur Render : sans trust proxy,
      # req.ip = IP du routeur PARTAGÉE par tout le monde (le login à 5/min
      # devient un verrou collectif un matin de marché). À CALIBRER au dashboard
      # après mesure de la chaîne réelle via GET /api/v1/health/net depuis un
      # téléphone (valeur = nombre de sauts, typiquement "1" sur Render).
      # Voir docs/AUDIT_THROTTLING.md § trust proxy.
      - key: TRUST_PROXY
        sync: false
      # Télémétrie d'erreurs (optionnelle) : poser le DSN au dashboard pour
      # activer Sentry ; sans DSN le backend reste 100 % silencieux (no-op).
      - key: SENTRY_DSN
        sync: false
      # Optionnel (voix cloud) — le cœur marche sans
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

  # ── Frontend React (site statique) ──────────────────────────────────────
  - type: web
    runtime: static
    name: julaba-web
    # (pas de `plan` : les sites statiques Render sont gratuits par nature)
    # Déploiement AUTOMATIQUE à chaque push sur la branche suivie (plus besoin de
    # cliquer « Manual Deploy » après chaque correction).
    autoDeploy: true
    buildCommand: cd frontend_src && npm ci --include=dev && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # URL du backend (utilisée au BUILD du frontend)
      - key: VITE_API_URL
        value: https://julaba-api.onrender.com/api/v1
    routes:
      # Routage d'une SPA : toutes les routes retombent sur index.html
      - type: rewrite
        source: /*
        destination: /index.html
