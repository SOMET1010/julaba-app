name: RC1 — intégration et Postgres

on:
  push:
    branches: [release/rc1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Garde-fous RC1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  postgres:
    name: Invariants RC1 sur PostgreSQL réel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: julaba_user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U julaba_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: julaba_user
      DB_PASSWORD: test
      DB_NAME: julaba_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unitaires backend
        run: npm run test:unit -w backend
      - name: Invariants PostgreSQL
        run: npm run test:invariants -w backend
