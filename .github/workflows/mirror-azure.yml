name: Miroir Azure DevOps

# Miroir de CE dépôt vers Azure DevOps (DevOps-ANSUT/julaba-app) — le lab GitHub est
# l'environnement de développement, la plateforme cible de l'équipe est Azure.
# À CHAQUE push GitHub (toutes branches), toutes les branches et les tags sont
# poussés vers le dépôt Azure — plus aucun push manuel vers Azure : le `dev` du
# lab est visible côté Azure dès qu'il est poussé sur GitHub.
# Chaque référence part individuellement : une divergence côté Azure (ex. un
# push direct côté Azure, comme le master sur sa ligne devops distincte) sort
# en avertissement, n'est jamais écrasée, et n'empêche pas les autres branches
# de passer.
#
# (Historique : l'ancien job clonait un AUTRE dépôt — Desiralex25/Julabaovh — et
# poussait master/develop ; il ne se déclenchait jamais. Remplacé, puis étendu
# de « main seulement, à chaque merge » à « toutes les branches, à chaque
# push » — le travail quotidien vivant sur `dev`, le miroir main-seul ne
# reflétait jamais rien.)
#
# Secret à poser : AZURE_DEVOPS_PAT (PAT Azure DevOps, droit « Code: Read & Write »
# sur le projet Julaba). Sans lui, le job sort en « succès avec avertissement » —
# pas de croix rouge, mais l'oubli reste visible dans chaque run.

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-azure
  cancel-in-progress: true

jobs:
  miroir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$AZURE_PAT" ]; then
            echo "::warning::AZURE_DEVOPS_PAT absent — miroir Azure NON effectué. Poser le secret (PAT Code Read & Write, voir docs/AZURE.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloner ce dépôt (historique complet)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pousser chaque branche et chaque tag vers Azure DevOps
        if: steps.cfg.outputs.configured == 'true'
        run: |
          AUTH=$(printf ":%s" "$AZURE_PAT" | base64 -w0)
          AZURE_URL="https://dev.azure.com/DevOps-ANSUT/julaba-app/_git/julaba-app"
          ok=0; divergentes=0
          # Branches : le checkout ne crée qu'une branche locale (celle du ref
          # demandé), les autres n'existent que dans refs/remotes/origin — on
          # pousse donc depuis le suivi distant vers refs/heads Azure.
          while read -r ref; do
            short="${ref#refs/remotes/origin/}"
            if git -c http.extraheader="Authorization: Basic ${AUTH}" push "$AZURE_URL" "${ref}:refs/heads/${short}"; then
              ok=$((ok+1))
            else
              divergentes=$((divergentes+1))
              echo "::warning::branche ${short} non reflétée côté Azure (divergence — à réconcilier à la main, jamais écrasée)."
            fi
          done < <(git for-each-ref refs/remotes/origin --format='%(refname)' | grep -v '/HEAD$')
          # Tags : même traitement, référence par référence.
          while read -r ref; do
            if git -c http.extraheader="Authorization: Basic ${AUTH}" push "$AZURE_URL" "${ref}:${ref}"; then
              ok=$((ok+1))
            else
              divergentes=$((divergentes+1))
              echo "::warning::tag ${ref#refs/tags/} non reflété côté Azure (divergence — à réconcilier à la main, jamais écrasé)."
            fi
          done < <(git for-each-ref refs/tags --format='%(refname)')
          echo "Miroir : ${ok} références poussées, ${divergentes} divergente(s)."
