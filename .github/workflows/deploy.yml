name: Deploy JULABA to Production

# ⚠️ DÉPLOIEMENT (CD) — DÉCLENCHEMENT MANUEL UNIQUEMENT.
#
# Cible de production NON CONFIRMÉE : le dépôt contient deux chaînes
# concurrentes (Render statique vs ce serveur SSH/Docker julaba.online) et rien
# ne prouve réellement laquelle sert la prod. Tant que ce n'est pas tranché par
# une preuve d'infrastructure/administration (pas par inférence depuis le
# dépôt), ce workflow N'EST PAS branché sur `main` : il ne s'exécute QUE sur
# demande explicite (« Run workflow »). Voir ci/README.md.
#
# L'ancien déclencheur `push: master` visait une branche INEXISTANTE (la
# branche par défaut est `main`) : il ne se déclenchait jamais. Retiré pour
# lever l'ambiguïté — et volontairement NON remplacé par `main`, afin de ne pas
# activer un auto-déploiement vers une cible non confirmée. Étapes de
# déploiement inchangées.

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Exécuter les migrations TypeORM en base de prod (backend d'abord, idempotent). Laisser décoché pour un déploiement de code seul."
        type: boolean
        default: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Monorepo npm workspaces : un seul lockfile a la racine, pas de
      # frontend_src/package-lock.json. On installe depuis la racine et on build
      # le workspace frontend (Vite emet dans ../frontend/dist, cf. vite.config).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace frontend_src

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend to server
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/julaba/frontend/dist/

      - name: Sync backend source to server
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            backend/src/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend_src/

      - name: Sync backend build files to server
        run: |
          rsync -av \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            backend/Dockerfile \
            backend/.dockerignore \
            backend/package.json \
            backend/package-lock.json \
            backend/tsconfig.json \
            backend/nest-cli.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/julaba/backend/

      - name: Build and restart backend container
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo rsync -av --delete /tmp/backend_src/ /var/www/julaba/backend/src/ && \
             cd /var/www/julaba && \
             sudo docker compose --env-file /var/www/julaba/backend/.env.production build --no-cache backend && \
             sudo docker compose --env-file /var/www/julaba/backend/.env.production up -d --force-recreate backend"

      # ── Migrations TypeORM ────────────────────────────────────────────────
      # Le conteneur runtime est buildé `npm ci --omit=dev` et npm/npx y sont
      # retirés : ni ts-node ni le script npm ne sont disponibles. On invoque
      # donc le CLI TypeORM compilé (typeorm est une dépendance runtime) contre
      # la data-source et les migrations compilées dans dist/. `migration:run`
      # est idempotent (seules les migrations non appliquées s'exécutent).
      - name: Attendre que le conteneur backend réponde
        run: |
          for i in 1 2 3 4 5 6; do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
                 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
                 "sudo docker exec julaba_backend node -e 'process.exit(0)'"; then
              echo "Conteneur backend prêt."; exit 0
            fi
            echo "Conteneur pas encore prêt (tentative $i)…"; sleep 5
          done
          echo "Le conteneur backend ne répond pas — migration impossible."; exit 1

      - name: Migrations en attente (lecture seule)
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo docker exec julaba_backend node ./node_modules/typeorm/cli.js migration:show -d dist/database/data-source.js"

      - name: Exécuter les migrations TypeORM
        if: ${{ inputs.run_migrations }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo docker exec julaba_backend node ./node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js"

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://julaba.online/api/v1/health || true)
            echo "Tentative $i : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Health check KO apres 6 tentatives - backend non sain"
          exit 1
