# Config interne du container frontend
# Montee par docker-compose sur /etc/nginx/conf.d/default.conf (donc incluse
# dans le bloc http). Sur vm-dev-test, Nginx Proxy Manager est devant : il
# termine TLS et pose HSTS.

# ── En-tetes de securite (scan OWASP ZAP) ──────────────────────────────────
# CSP : origines reellement utilisees par frontend/src, a tenir a jour si une
# nouvelle origine externe apparait (sinon elle sera bloquee par le navigateur).
#   script-src  : uniquement les bundles Vite ; ni inline ni eval
#   style-src   : 'unsafe-inline' requis (balises <style> injectees par sonner
#                 et Radix, styles de la fenetre d'impression d'export.utils)
#   img-src     : images Cloudinary et Unsplash, tuiles Leaflet CARTO et
#                 OpenStreetMap, data:/blob: (apercus photo, QR code)
#   media-src   : clips voix /voix/*.mp3 et audio decode en blob:
#   connect-src : API et socket.io en meme origine (VITE_API_URL vide), meteo
#                 Open-Meteo, geocodage Nominatim, upload Cloudinary, Sentry
#   worker-src  : service worker /sw.js et worker blob: de Sentry Replay
map $host $julaba_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org https://api.cloudinary.com https://*.ingest.de.sentry.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Fonctions navigateur : micro (vente vocale), camera (photos, scan QR),
# geolocalisation et WebAuthn (passkeys) restent permis a l'appli elle-meme.
map $host $julaba_permissions_policy {
    default "accelerometer=(), autoplay=(self), camera=(self), display-capture=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(self), midi=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), usb=()";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx (en-tete Server, pages d'erreur)
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # HERITAGE NGINX : une location qui declare son propre add_header n'herite
    # plus d'AUCUN add_header du niveau server. Les en-tetes de securite sont
    # donc repetes dans chaque location qui sert le frontend (garder les deux
    # listes identiques). /api/ et /socket.io/ n'en posent pas : le backend
    # (helmet) envoie deja les siens, les doubler donnerait deux CSP.

    # Cache des assets statiques (images, JS, CSS)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $julaba_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $julaba_permissions_policy always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }

    # Proxy API REST vers le backend (reseau Docker interne)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (socket.io) vers le backend
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — toutes les routes renvoient index.html.
    # Pas de "$uri/" : un repertoire sans index (/assets/, /voix/...) renverrait
    # un 403 que ZAP sait contourner (/assets%20/ -> 200, alerte 40038).
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy $julaba_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $julaba_permissions_policy always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
