# ============================================================
# JULABA — Vhost ANSUT DEV (julaba-dev.ansut.ci)
# Déploiement réel sur ANSUT-WAZUH-DEV-WEB-1 (docker compose -f docker-compose.ansut.yml).
#   /api/       → backend NestJS  127.0.0.1:3004
#   /socket.io/ → backend (WebSocket)
#   /           → frontend SPA    127.0.0.1:8080
# Domaine actuellement servi en HTTP. Ajouter SSL plus tard avec Certbot.
# ============================================================

server {
    listen 80;
    server_name julaba-dev.ansut.ci;


    access_log /var/log/nginx/julaba-dev.access.log;
    error_log  /var/log/nginx/julaba-dev.error.log;

    # Uploads photos / pièces (base64 + multipart)
    client_max_body_size 20M;

    # API Backend NestJS (/api/v1/...)
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket socket.io (ticker backoffice temps réel)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3004/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React (SPA — toutes les routes retombent sur index.html)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # React Router (SPA)
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        rewrite ^ /index.html break;
        proxy_pass http://127.0.0.1:8080;
    }
}
